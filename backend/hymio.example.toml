database = "./data/hymio.sqlite"
issuer = "http://localhost:8000"
client_id = "REPLACE_WITH_CASDOOR_CLIENT_ID"
client_secret_file = "./private/casdoor-client-secret"
public_url = "http://localhost:8080"
callback_url = "http://localhost:8080/auth/callback"
service_token_file = "./private/oath-auth-token"
# Optional Oath service token used only by the admin console for cross-user trace reads.
# oath_admin_token_file = "./private/oath-admin-token"
origins = [
  "http://127.0.0.1:1420",
  "http://localhost:1420",
  "http://127.0.0.1:1421",
  "http://localhost:1421",
  "http://tauri.localhost",
  "tauri://localhost",
]
# Internal upstream. Clients receive public_url + /agent/ws.
oath_ws = "ws://127.0.0.1:8765"
oath_biz = "http://127.0.0.1:8766"
# Internal Hymio Kit Host. Cloud Compose overrides this with http://kit-host:8090.
kits_url = "http://127.0.0.1:8090"
access_seconds = 900
refresh_seconds = 2592000
host = "127.0.0.1"
port = 8080

# Set google only after configuring a Google-only Casdoor application with signup.
login_method = "account"
signup_enabled = true
# Optional private file; one reusable invitation code per line, reloaded per signup.
# invitation_codes_file = "./private/invitation-codes"

# One hosted E2B Desktop per user. Credentials stay in Backend.
computer_provider = "e2b"
e2b_key_file = "./private/e2b-api-key"
e2b_template = "hymio-desktop"

# Choices must be deployed in Oath, including independent model_providers. Restart after changing.
model_options = ["MiniMax-M2.7", "MiniMax-M3"]
# Confirmed deployed capacities; use the same map in Oath agent.model_context_windows.
model_context_windows = {}
# Internal read-only Prometheus endpoint used by the operator console.
prometheus_url = "http://127.0.0.1:19090"
observability_retention_days = 7
observability_max_events = 20000
# Optional operator link. Leave empty when Grafana is not exposed publicly.
grafana_url = ""
# Add "deepseek-flash" after configuring its Oath model_providers entry and Vault alias.
vision_model = "MiniMax-M3"
# Local launcher derives these from oath.toml; set explicitly in cloud deployments.
# media_api_base = "https://api.minimax.cn/v1"
# media_credential = "model/default"
# vault_url = "http://vault:8200"
# vault_role_id_file = "./private/vault-role-id"
# vault_secret_id_file = "./private/vault-secret-id"
# Optional per-user Nostalgia endpoints and credential file references.
# nostalgia_connections_file = "./private/nostalgia-connections.json"

# Optional APNs. Keep the p8 key outside source control and mount it through the
# private Backend config directory. Live Activities require the same APNs setup.
# apns_key_file = "./private/apns-auth-key.p8"
# apns_key_id = "REPLACE_WITH_APPLE_KEY_ID"
# apns_team_id = "REPLACE_WITH_APPLE_TEAM_ID"
# apns_bundle_id = "space.hymio.ios"
# apns_environment = "sandbox" # sandbox for development, production for distribution
