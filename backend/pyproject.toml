[project]
name = "hymio-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.41,<1",
    "uvicorn>=0.32,<1",
    "httpx>=0.27,<1",
    "PyJWT[crypto]>=2.10,<3",
    "cryptography>=44",
    "websockets>=15,<17",
    "pillow>=11,<13",
    "markitdown[pdf,docx,pptx,xlsx,xls]>=0.1.3,<0.2",
    "daytona>=0.225,<0.226",
]

[project.optional-dependencies]
e2b = [
    "e2b-desktop>=2.7.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hymio_backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
