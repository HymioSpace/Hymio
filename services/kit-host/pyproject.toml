[project]
name = "hymio-kit-host"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.41,<1",
    "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "httpx>=0.27,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kit_host"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
