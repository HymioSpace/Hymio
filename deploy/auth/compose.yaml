name: hymio-auth
services:
  casdoor-permissions:
    image: busybox:1.37.0
    command: [chown, "1000:1000", /data]
    volumes: [casdoor-data:/data]
  casdoor:
    image: casbin/casdoor:4.20.0
    restart: unless-stopped
    depends_on:
      casdoor-permissions: {condition: service_completed_successfully}
    ports: ["127.0.0.1:8000:8000"]
    environment:
      driverName: sqlite
      dataSourceName: "file:/data/casdoor.db?cache=shared"
      dbName: casdoor
      origin: http://localhost:8000
    volumes: [casdoor-data:/data]
volumes:
  casdoor-data:
